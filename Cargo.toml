[package]
name = "dst-update-publisher"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls"] }
rss = "2"
scraper = "0.27"
zip = "8"
polib = "0.3"
redis = { version = "1.7", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
async-openai = { version = "0.42", features = ["chat-completion"] }
chrono = "0.4"
url = "2"
once_cell = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
canonical-msg = { git = "https://github.com/NullOnSpace/canonical-msg.git", branch = "main" }
ulid = "3"
regex = "1"

[dev-dependencies]
mockito = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"